services:
  - type: web
    name: traffic-strategy-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # AUTH-003A - see backend/.env.example for what each of these is
      # and why; not secrets in the SUPABASE_URL case (it's the same
      # project URL already public in the frontend bundle), but kept
      # sync:false here too since this file is the deployment config,
      # not the place to hardcode any environment's actual value.
      - key: SUPABASE_URL
        sync: false
      # AUTH-003B - the project's public anon key (same one already in
      # the frontend bundle as VITE_SUPABASE_ANON_KEY - not a secret).
      # Required as PostgREST's `apikey` header by the strategies proxy
      # (backend/routes/strategiesProxy.js); the real per-user identity
      # comes from the Authorization: Bearer header, not this key.
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_DB_URL
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_CLIENT_ID
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_CLIENT_SECRET
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_REDIRECT_URI
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_SESSION_SECRET
        sync: false
