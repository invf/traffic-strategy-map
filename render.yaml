services:
  - type: web
    name: traffic-strategy-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # AUTH-003A - see backend/.env.example for what each of these is
      # and why; not secrets in the SUPABASE_URL case (it's the same
      # project URL already public in the frontend bundle), but kept
      # sync:false here too since this file is the deployment config,
      # not the place to hardcode any environment's actual value.
      - key: SUPABASE_URL
        sync: false
      # AUTH-003B - the project's public anon key (not a secret by
      # itself - the frontend no longer ships its own Supabase client/
      # key at all, this backend's strategiesProxy.js is the only place
      # that needs it). Required as PostgREST's `apikey` header; the
      # real per-user identity comes from the Authorization: Bearer
      # header, not this key.
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_DB_URL
        sync: false
      # AUTH-003C TLS fix - the Supabase Session Pooler's CA certificate
      # (Supabase Dashboard -> Project Settings -> Database -> SSL
      # Configuration -> "Download certificate"). REQUIRED in Production:
      # without it, TRAFFIC_STRATEGY_MAP_DB_URL above fails closed with
      # "self-signed certificate in certificate chain" against Supabase's
      # real pooler chain. If Render's own Secret Files feature is used
      # instead (set via the dashboard, not this blueprint file), set
      # TRAFFIC_STRATEGY_MAP_DB_CA_CERT_FILE to that mounted path instead
      # of this inline value - see backend/.env.example and backend/
      # lib/entitlements.js for both options; only one is needed.
      - key: TRAFFIC_STRATEGY_MAP_DB_CA_CERT
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_CLIENT_ID
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_CLIENT_SECRET
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_OAUTH_REDIRECT_URI
        sync: false
      - key: TRAFFIC_STRATEGY_MAP_SESSION_SECRET
        sync: false
      # AUTH-003B same-origin proxy (Option B, approved) - optional;
      # omit entirely in normal operation (defaults to Lax, correct for
      # the Vercel-proxied architecture). Set to None only as an
      # explicit, temporary rollback - see
      # docs/AUTH_003B_PRE_PRODUCTION_AUDIT.md.
      - key: TRAFFIC_STRATEGY_MAP_COOKIE_SAMESITE
        sync: false
